<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AAFL Weigh-Master Stage Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6">

  <div class="max-w-7xl mx-auto space-y-6">

    <!-- TOP BAR -->
    <div class="flex flex-wrap justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-xl gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span id="stageSyncDot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
          <h1 id="stageTitle" class="text-xl font-black text-white">CONNECTING TO ACTIVE STAGE...</h1>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">
          Press <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-amber-400 font-bold">/</kbd> to search anglers | 
          <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-amber-400 font-bold">Space</kbd> to lock live scale weight
        </p>
      </div>

      <div class="flex items-center gap-3">
        <a href="register.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-black text-white transition">
          ← Registration Desk
        </a>
        <button id="scaleBtn" onclick="connectScale()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs font-bold flex items-center gap-2">
          <span id="scaleDot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          <span id="scaleLabel">Connect Digital Scale (USB)</span>
        </button>
        <button onclick="openJumbotron()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg text-xs font-black text-slate-950 transition">
          Open Jumbotron ↗
        </button>
      </div>
    </div>

    <!-- MAIN OPERATOR CONSOLE -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- COLUMN 1: LIVE ANGLER SEARCH -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-xl flex flex-col justify-between">
        <div>
          <label class="text-xs font-bold uppercase text-slate-400 block mb-2">Find Angler on Stage (Press '/')</label>
          <input id="anglerSearch" placeholder="Type boat # or captain name..." class="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-white font-medium mb-3 focus:border-blue-500 focus:outline-none" />
          <div id="searchResults" class="space-y-1.5 max-h-56 overflow-y-auto"></div>

          <div id="selectedBox" class="hidden mt-4 p-4 bg-blue-950/40 border border-blue-800/60 rounded-xl">
            <span class="text-[10px] font-black uppercase text-blue-400 tracking-wider">Active on Bump Board</span>
            <p id="selectedName" class="text-2xl font-black text-white mt-1"></p>
          </div>
        </div>

        <div class="border-t border-slate-800 pt-4 text-xs text-slate-500 flex justify-between items-center">
          <span>Synced with live registration desk</span>
          <span id="localRosterCount" class="font-mono text-slate-400">0 loaded</span>
        </div>
      </div>

      <!-- COLUMN 2: HARDWARE SCALE STREAM -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-xl text-center">
        <span class="text-xs font-bold uppercase text-slate-400 block text-left">Live Scale Feed</span>

        <div class="bg-slate-950 border border-slate-800 p-6 rounded-xl my-4">
          <span id="liveWeightDisplay" class="font-mono text-6xl font-black text-emerald-400">0.00</span>
          <span class="text-lg text-slate-500 font-bold ml-1">LBS</span>
        </div>

        <div class="text-left space-y-4">
          <div>
            <label class="text-xs font-bold text-slate-400 uppercase">Gross Weight (Keypad or Scale)</label>
            <input id="grossInput" type="number" step="0.01" placeholder="0.00" class="w-full text-center text-3xl font-black bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white mt-1 focus:border-blue-500 focus:outline-none" />
          </div>

          <div>
            <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Dead Fish Count (-0.25 lb each)</label>
            <div class="flex gap-2">
              <button type="button" onclick="setDead(0)" class="deadBtn flex-1 py-2 bg-red-600 text-white font-bold rounded text-xs">0</button>
              <button type="button" onclick="setDead(1)" class="deadBtn flex-1 py-2 bg-slate-800 text-slate-400 font-bold rounded text-xs">1</button>
              <button type="button" onclick="setDead(2)" class="deadBtn flex-1 py-2 bg-slate-800 text-slate-400 font-bold rounded text-xs">2</button>
              <button type="button" onclick="setDead(3)" class="deadBtn flex-1 py-2 bg-slate-800 text-slate-400 font-bold rounded text-xs">3</button>
              <button type="button" onclick="setDead(4)" class="deadBtn flex-1 py-2 bg-slate-800 text-slate-400 font-bold rounded text-xs">4</button>
              <button type="button" onclick="setDead(5)" class="deadBtn flex-1 py-2 bg-slate-800 text-slate-400 font-bold rounded text-xs">5</button>
            </div>
          </div>
        </div>
      </div>

      <!-- COLUMN 3: OFFICIAL NET & BROADCAST LOCK -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-xl flex flex-col justify-between">
        <div>
          <span class="text-xs font-bold uppercase text-slate-400">Scorecard Calculation</span>

          <div class="my-6 space-y-3">
            <div class="flex justify-between text-sm">
              <span class="text-slate-400">Gross Bag:</span>
              <span id="grossDisplay" class="font-mono text-white font-bold">0.00 lbs</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-slate-400">Dead Penalty:</span>
              <span id="penaltyDisplay" class="font-mono text-red-400 font-bold">-0.00 lbs</span>
            </div>
            <div class="border-t border-slate-800 pt-3 flex justify-between items-baseline">
              <span class="font-bold text-white text-base">Official Net:</span>
              <span id="netDisplay" class="font-mono text-4xl font-black text-blue-400">0.00 lbs</span>
            </div>
          </div>
        </div>

        <button id="commitBtn" onclick="commitWeight()" disabled class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-20 text-white font-black rounded-xl text-base shadow-lg transition">
          OFFICIAL LOCK & COMMIT
        </button>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gjoxrosyboapwfqlfdye.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdqb3hyb3N5Ym9hcHdmcWxmZHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDEwMzQsImV4cCI6MjEwNDI3NzAzNH0.SFcX-NYJgL8lGv5QP2HXN83eaL7x2v0KCJonJXYoUAE';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const broadcast = new BroadcastChannel('stage_jumbotron_feed');

    let activeTournament = null;
    let selectedAngler = null;
    let deadCount = 0;
    let liveWeight = 0.00;
    let cachedAnglers = [];

    window.addEventListener('DOMContentLoaded', async () => {
      await loadTournament();
      setupRealtimeSync();
    });

    async function loadTournament() {
      try {
        const { data, error } = await client
          .from('tournaments')
          .select('*')
          .eq('is_active', true)
          .order('created_at', { ascending: false })
          .limit(1);

        if (error || !data || data.length === 0) {
          document.getElementById('stageTitle').innerText = 'NO ACTIVE TOURNAMENT IN SUPABASE';
          document.getElementById('stageSyncDot').className = 'w-3 h-3 rounded-full bg-red-500';
          return;
        }

        activeTournament = data[0];
        document.getElementById('stageTitle').innerText = activeTournament.title.toUpperCase();
        document.getElementById('stageSyncDot').className = 'w-3 h-3 rounded-full bg-emerald-500';

        // Preload participant roster for local search speed
        await refreshParticipants();

        // Broadcast initial tournament state to Jumbotron
        broadcast.postMessage({
          type: 'TOURNAMENT_SYNC',
          tournamentTitle: activeTournament.title,
          lakeName: activeTournament.lake_name || 'Lake Fork',
          eventDate: activeTournament.event_date
        });

      } catch (err) {
        console.error('Initialization error:', err);
        document.getElementById('stageTitle').innerText = 'CONNECTION ERROR';
        document.getElementById('stageSyncDot').className = 'w-3 h-3 rounded-full bg-red-500';
      }
    }

    async function refreshParticipants() {
      if (!activeTournament) return;
      const { data } = await client
        .from('tournament_participants')
        .select('*')
        .eq('tournament_id', activeTournament.id)
        .order('created_at', { ascending: true });

      cachedAnglers = data || [];
      document.getElementById('localRosterCount').innerText = `${cachedAnglers.length} boats registered`;
    }

    function setupRealtimeSync() {
      // 1. Listen to Supabase Realtime Postgres Changes
      client
        .channel('stage-sync')
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'tournament_participants' 
        }, () => {
          refreshParticipants();
        })
        .subscribe();

      // 2. Listen to Browser BroadcastChannel (Instant Cross-Tab Messages)
      broadcast.onmessage = (event) => {
        const msg = event.data;
        if (msg.type === 'NEW_ANGLER_REGISTERED') {
          cachedAnglers.push(msg.angler);
          document.getElementById('localRosterCount').innerText = `${cachedAnglers.length} boats registered`;
        }
      };
    }

    // SEARCH
    const searchInput = document.getElementById('anglerSearch');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const resBox = document.getElementById('searchResults');
      if (q.length < 1) { resBox.innerHTML = ''; return; }

      const matches = cachedAnglers.filter(a => a.display_name.toLowerCase().includes(q)).slice(0, 6);
      resBox.innerHTML = '';

      matches.forEach(a => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-2.5 bg-slate-950 hover:bg-blue-600 rounded-lg text-sm font-semibold text-white flex justify-between border border-slate-800 transition';
        btn.innerHTML = `<span>${a.display_name}</span> <span class="text-xs bg-slate-800 px-2 py-0.5 rounded">SELECT</span>`;
        btn.onclick = () => selectAngler(a);
        resBox.appendChild(btn);
      });
    });

    function selectAngler(a) {
      selectedAngler = a;
      document.getElementById('selectedBox').classList.remove('hidden');
      document.getElementById('selectedName').innerText = a.display_name;
      document.getElementById('searchResults').innerHTML = '';
      searchInput.value = '';
      document.getElementById('commitBtn').disabled = false;

      // Notify Jumbotron immediately
      broadcast.postMessage({
        type: 'ANGLER_ON_STAGE',
        anglerName: a.display_name
      });
    }

    function setDead(count) {
      deadCount = count;
      document.querySelectorAll('.deadBtn').forEach((btn, idx) => {
        btn.className = idx === count 
          ? 'deadBtn flex-1 py-2 bg-red-600 text-white font-bold rounded text-xs' 
          : 'deadBtn flex-1 py-2 bg-slate-800 text-slate-400 font-bold rounded text-xs';
      });
      recalculate();
    }

    const grossInput = document.getElementById('grossInput');
    grossInput.addEventListener('input', recalculate);

    function recalculate() {
      const gross = parseFloat(grossInput.value) || 0.00;
      const penalty = deadCount * 0.25;
      const net = Math.max(0, gross - penalty);

      document.getElementById('grossDisplay').innerText = `${gross.toFixed(2)} lbs`;
      document.getElementById('penaltyDisplay').innerText = `-${penalty.toFixed(2)} lbs`;
      document.getElementById('netDisplay').innerText = `${net.toFixed(2)} lbs`;

      // Live mirror to Jumbotron during bag weighing
      broadcast.postMessage({
        type: 'LIVE_WEIGHT_TICKER',
        grossWeight: gross.toFixed(2),
        netWeight: net.toFixed(2),
        deadPenalty: penalty.toFixed(2)
      });
    }

    async function commitWeight() {
      if (!selectedAngler || !activeTournament) return;

      const gross = parseFloat(grossInput.value) || 0;
      const penalty = deadCount * 0.25;
      const net = Math.max(0, gross - penalty);

      const commitBtn = document.getElementById('commitBtn');
      commitBtn.innerText = 'Locking...';
      commitBtn.disabled = true;

      const { error } = await client.from('official_stage_weights').insert({
        tournament_id: activeTournament.id,
        participant_id: selectedAngler.id,
        gross_weight_lbs: gross,
        dead_fish_count: deadCount,
        dead_penalty_deduction: penalty,
        net_weight_lbs: net,
        is_locked: true
      });

      commitBtn.innerText = 'OFFICIAL LOCK & COMMIT';

      if (error) {
        alert('Database Error: ' + error.message);
        commitBtn.disabled = false;
        return;
      }

      // Broadcast the final locked weight to the Jumbotron
      broadcast.postMessage({
        type: 'WEIGHT_LOCKED',
        anglerName: selectedAngler.display_name,
        netWeight: net.toFixed(2)
      });

      alert(`Official Net of ${net.toFixed(2)} lbs locked for ${selectedAngler.display_name}!`);

      selectedAngler = null;
      grossInput.value = '';
      setDead(0);
      recalculate();
      document.getElementById('selectedBox').classList.add('hidden');
      document.getElementById('commitBtn').disabled = true;
    }

    // WEB SERIAL DRIVER (SCALE STREAM)
    async function connectScale() {
      if (!('serial' in navigator)) {
        alert('Web Serial requires Google Chrome or Microsoft Edge.');
        return;
      }
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        document.getElementById('scaleDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
        document.getElementById('scaleLabel').innerText = 'Scale Streaming (9600 Baud)';

        const decoder = new TextDecoderStream();
        port.readable.pipeTo(decoder.writable);
        const reader = decoder.readable.getReader();

        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          const lines = buf.split(/\r\n|\n/);
          buf = lines.pop();
          for (const line of lines) {
            const match = line.match(/[-+]?[0-9]*\.?[0-9]+/);
            if (match) {
              liveWeight = parseFloat(match[0]);
              document.getElementById('liveWeightDisplay').innerText = liveWeight.toFixed(2);
              if (selectedAngler) {
                grossInput.value = liveWeight.toFixed(2);
                recalculate();
              }
            }
          }
        }
      } catch (e) {
        console.error('Scale error:', e);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.code === 'Space' && document.activeElement === document.body && liveWeight > 0) {
        e.preventDefault();
        grossInput.value = liveWeight.toFixed(2);
        recalculate();
      }
    });

    function openJumbotron() {
      window.open('jumbotron.html', '_blank', 'width=1280,height=720');
    }
  </script>
</body>
</html>
