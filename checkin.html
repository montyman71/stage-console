<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AAFL Dockside Check-In Station</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 select-none">

  <div class="max-w-2xl mx-auto space-y-4">

    <!-- TOP BAR -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-xl flex justify-between items-center">
      <div>
        <div class="flex items-center gap-2">
          <span id="syncDot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <h1 id="checkinHeading" class="text-base font-black text-white uppercase tracking-wider">CONNECTING...</h1>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Dockside Fish Inspector & Stage Queue Hub</p>
      </div>
      <div class="flex items-center gap-2">
        <span id="queueBadge" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs px-2.5 py-1 rounded font-bold font-mono">0 in Queue</span>
        <a href="auth.html" class="text-xs text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded">👤 Auth</a>
      </div>
    </div>

    <!-- ANGLER LOOKUP & CHECK-IN FORM -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-xl space-y-4">
      <h2 class="text-sm font-black uppercase text-amber-400 tracking-wider">📋 Select Arriving Boat</h2>

      <!-- Search Input -->
      <div>
        <input id="searchAngler" type="text" placeholder="Type Boat # or Captain name..." class="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-white font-bold text-base focus:border-blue-500 focus:outline-none placeholder-slate-500" />
        <div id="searchResults" class="mt-2 space-y-1 max-h-48 overflow-y-auto"></div>
      </div>

      <!-- Selected Boat Card -->
      <div id="activeBoatCard" class="hidden p-4 bg-slate-950 border border-blue-800/80 rounded-xl space-y-4">
        <div>
          <span class="text-[10px] font-black uppercase text-blue-400 tracking-wider block">Checked In For Inspection:</span>
          <h3 id="cardBoatName" class="text-xl font-black text-white">Boat # - Name</h3>
        </div>

        <!-- Fish Counts Grid -->
        <div class="grid grid-cols-2 gap-3 pt-2">
          <!-- ALIVE FISH -->
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-center">
            <span class="text-xs font-bold text-emerald-400 uppercase block mb-1">🟢 Alive Fish</span>
            <div class="flex items-center justify-center gap-3">
              <button type="button" onclick="adjustCount('alive', -1)" class="w-10 h-10 bg-slate-800 active:bg-slate-700 rounded-lg font-black text-xl text-white">-</button>
              <span id="aliveDisplay" class="font-mono text-3xl font-black text-white">5</span>
              <button type="button" onclick="adjustCount('alive', 1)" class="w-10 h-10 bg-slate-800 active:bg-slate-700 rounded-lg font-black text-xl text-white">+</button>
            </div>
          </div>

          <!-- DEAD FISH -->
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-center">
            <span class="text-xs font-bold text-red-400 uppercase block mb-1">🔴 Dead Fish</span>
            <div class="flex items-center justify-center gap-3">
              <button type="button" onclick="adjustCount('dead', -1)" class="w-10 h-10 bg-slate-800 active:bg-slate-700 rounded-lg font-black text-xl text-white">-</button>
              <span id="deadDisplay" class="font-mono text-3xl font-black text-red-400">0</span>
              <button type="button" onclick="adjustCount('dead', 1)" class="w-10 h-10 bg-slate-800 active:bg-slate-700 rounded-lg font-black text-xl text-white">+</button>
            </div>
          </div>
        </div>

        <div class="flex justify-between items-center text-xs font-mono text-slate-400 px-1">
          <span>Total Bag: <strong id="totalFishDisplay" class="text-white">5</strong> / 5 Fish</span>
          <span class="text-red-400">Penalty: <strong id="penaltyDisplay">-0.00 lbs</strong></span>
        </div>

        <!-- Confirm Action Button -->
        <button id="sendToStageBtn" onclick="confirmCheckIn()" class="w-full py-3.5 bg-emerald-600 active:bg-emerald-500 hover:bg-emerald-500 text-white font-black text-sm uppercase rounded-lg shadow-lg transition">
          🚀 Send To Stage Queue
        </button>
      </div>
    </div>

    <!-- CURRENT LIVE STAGE QUEUE -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h2 class="text-xs font-black uppercase text-white tracking-wider">🛶 Boats In Holding Tanks (Queue)</h2>
        <button onclick="loadQueue()" class="text-[11px] text-blue-400 hover:underline font-bold">↻ Refresh</button>
      </div>

      <div id="queueList" class="space-y-2 max-h-64 overflow-y-auto">
        <p class="text-xs text-slate-500 text-center py-6">No boats in queue</p>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://gjoxrosyboapwfqlfdye.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdqb3hyb3N5Ym9hcHdmcWxmZHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDEwMzQsImV4cCI6MjEwNDI3NzAzNH0.SFcX-NYJgL8lGv5QP2HXN83eaL7x2v0KCJonJXYoUAE';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const broadcast = new BroadcastChannel('stage_jumbotron_feed');

    let activeTournament = null;
    let participants = [];
    let selectedAngler = null;
    let aliveCount = 5;
    let deadCount = 0;

    function getTargetTournamentId() {
      const p = new URLSearchParams(window.location.search);
      return p.get('tid') || localStorage.getItem('aafl_active_tid');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadTournament();
      setupRealtime();
    });

    async function loadTournament() {
      const targetId = getTargetTournamentId();
      let query = client.from('tournaments').select('*');

      if (targetId) {
        query = query.eq('id', targetId);
      } else {
        query = query.eq('is_active', true).order('created_at', { ascending: false });
      }

      const { data, error } = await query.limit(1);

      if (error || !data || data.length === 0) {
        document.getElementById('checkinHeading').innerText = 'NO TOURNAMENT FOUND';
        document.getElementById('syncDot').className = 'w-3 h-3 rounded-full bg-red-500';
        return;
      }

      activeTournament = data[0];
      localStorage.setItem('aafl_active_tid', activeTournament.id);
      document.getElementById('checkinHeading').innerText = activeTournament.title;
      await loadParticipants();
      await loadQueue();
    }

    async function loadParticipants() {
      if (!activeTournament) return;
      const { data } = await client
        .from('tournament_participants')
        .select('*')
        .eq('tournament_id', activeTournament.id)
        .order('created_at', { ascending: true });

      participants = data || [];
    }

    async function loadQueue() {
      if (!activeTournament) return;
      const { data } = await client
        .from('live_stage_queue')
        .select('*')
        .eq('tournament_id', activeTournament.id);

      renderQueue(data || []);
    }

    function renderQueue(queue) {
      const container = document.getElementById('queueList');
      document.getElementById('queueBadge').innerText = `${queue.length} in Queue`;
      container.innerHTML = '';

      if (queue.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">No boats in queue</p>';
        return;
      }

      queue.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'p-3 bg-slate-950 border border-slate-800 rounded-lg flex justify-between items-center';
        div.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black font-mono px-2 py-0.5 rounded ${idx === 0 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'}">
                ${idx === 0 ? 'NEXT UP' : `#${idx + 1}`}
              </span>
              <span class="text-sm font-bold text-white">${q.display_name}</span>
            </div>
            <div class="text-[11px] text-slate-400 font-mono mt-1">
              🟢 ${q.alive_fish_count} Alive | 🔴 ${q.dead_fish_count} Dead
            </div>
          </div>
          <button onclick="removeCheckIn('${q.participant_id}')" class="text-slate-600 hover:text-red-400 font-bold text-xs p-1">✕</button>
        `;
        container.appendChild(div);
      });
    }

    const searchInput = document.getElementById('searchAngler');
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const resBox = document.getElementById('searchResults');
      if (!q) { resBox.innerHTML = ''; return; }

      const matches = participants
        .filter(p => p.display_name.toLowerCase().includes(q))
        .slice(0, 5);

      resBox.innerHTML = '';
      matches.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'w-full text-left p-2.5 bg-slate-950 hover:bg-blue-600 rounded-lg text-sm text-white font-semibold flex justify-between items-center border border-slate-800 transition';
        btn.innerHTML = `<span>${m.display_name}</span> <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded font-bold">${m.checkin_status || 'NOT IN'}</span>`;
        btn.onclick = () => selectBoat(m);
        resBox.appendChild(btn);
      });
    });

    function selectBoat(boat) {
      selectedAngler = boat;
      document.getElementById('searchResults').innerHTML = '';
      searchInput.value = '';
      document.getElementById('activeBoatCard').classList.remove('hidden');
      document.getElementById('cardBoatName').innerText = boat.display_name;

      aliveCount = boat.alive_fish_count !== undefined ? boat.alive_fish_count : 5;
      deadCount = boat.dead_fish_count !== undefined ? boat.dead_fish_count : 0;
      updateFishDisplays();
    }

    function adjustCount(type, delta) {
      if (type === 'alive') {
        aliveCount = Math.max(0, Math.min(5, aliveCount + delta));
      } else if (type === 'dead') {
        deadCount = Math.max(0, Math.min(5, deadCount + delta));
      }
      updateFishDisplays();
    }

    function updateFishDisplays() {
      document.getElementById('aliveDisplay').innerText = aliveCount;
      document.getElementById('deadDisplay').innerText = deadCount;
      document.getElementById('totalFishDisplay').innerText = (aliveCount + deadCount);
      document.getElementById('penaltyDisplay').innerText = `-${(deadCount * 0.25).toFixed(2)} lbs`;
    }

    async function confirmCheckIn() {
      if (!selectedAngler || !activeTournament) return;

      const btn = document.getElementById('sendToStageBtn');
      btn.innerText = 'Dispatching to Stage...';
      btn.disabled = true;

      const { error } = await client
        .from('tournament_participants')
        .update({
          alive_fish_count: aliveCount,
          dead_fish_count: deadCount,
          checkin_status: 'IN_QUEUE',
          checkin_timestamp: new Date().toISOString()
        })
        .eq('id', selectedAngler.id);

      btn.innerText = '🚀 Send To Stage Queue';
      btn.disabled = false;

      if (error) {
        alert('Check-In Failed: ' + error.message);
        return;
      }

      broadcast.postMessage({
        type: 'QUEUE_UPDATED',
        tournamentId: activeTournament.id,
        participantId: selectedAngler.id,
        displayName: selectedAngler.display_name,
        alive: aliveCount,
        dead: deadCount
      });

      document.getElementById('activeBoatCard').classList.add('hidden');
      selectedAngler = null;
      await loadParticipants();
      await loadQueue();
    }

    async function removeCheckIn(id) {
      if (!confirm('Remove this boat from queue?')) return;
      await client
        .from('tournament_participants')
        .update({ checkin_status: 'NOT_CHECKED_IN', checkin_timestamp: null })
        .eq('id', id);

      broadcast.postMessage({ type: 'QUEUE_UPDATED', tournamentId: activeTournament?.id });
      await loadParticipants();
      await loadQueue();
    }

    function setupRealtime() {
      client
        .channel('checkin-sync')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tournament_participants' }, () => {
          loadQueue();
        })
        .subscribe();

      broadcast.onmessage = (e) => {
        if (e.data.tournamentId && activeTournament && e.data.tournamentId !== activeTournament.id) {
          return;
        }
        if (e.data.type === 'QUEUE_UPDATED' || e.data.type === 'WEIGHT_LOCKED') {
          loadQueue();
        }
      };
    }
  </script>
</body>
</html>
