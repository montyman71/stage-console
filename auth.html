<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AAFL Tournament Suite - Staff Authentication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex items-center justify-center p-4">

  <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
    
    <div class="text-center space-y-1">
      <span class="text-xs font-black uppercase tracking-widest text-amber-400">American Anglers Fishing League</span>
      <h1 class="text-2xl font-black text-white uppercase">Staff Portal Access</h1>
      <p class="text-xs text-slate-400">Secure entry for Directors, Weigh-Masters & Inspectors</p>
    </div>

    <!-- LOGGED IN USER CARD -->
    <div id="userCard" class="hidden p-4 bg-slate-950 border border-emerald-500/40 rounded-xl space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-slate-400">Current Session</span>
        <span id="roleBadge" class="px-2 py-0.5 rounded text-[11px] font-mono font-bold bg-emerald-500/20 text-emerald-400 uppercase">DIRECTOR</span>
      </div>
      <div>
        <p id="userEmailDisplay" class="font-bold text-white text-sm"></p>
      </div>

      <!-- Station Dispatcher Links -->
      <div class="grid grid-cols-2 gap-2 pt-2 text-center text-xs font-black">
        <a href="register.html" class="p-2.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-white transition">
          Registration Desk
        </a>
        <a href="index.html" class="p-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 rounded-lg transition">
          Stage Console
        </a>
        <a href="checkin.html" class="p-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition">
          Dock Check-In
        </a>
        <a href="results.html" class="p-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition">
          Results & Wix
        </a>
      </div>

      <button onclick="handleSignOut()" class="w-full py-2 mt-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-lg transition">
        Sign Out
      </button>
    </div>

    <!-- LOGIN / REGISTER TABS & FORM -->
    <div id="authFormsWrapper">
      <div class="flex border-b border-slate-800 mb-4 text-xs font-bold uppercase">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 border-b-2 border-blue-500 text-white">Sign In</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-300">Create Account</button>
      </div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-3">
        <div id="nameField" class="hidden">
          <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Full Name</label>
          <input type="text" id="authFullName" placeholder="e.g. John Doe" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Email Address</label>
          <input type="email" id="authEmail" required placeholder="director@aafl.com" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 focus:outline-none" />
        </div>

        <div>
          <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Password</label>
          <input type="password" id="authPassword" required placeholder="••••••••" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 focus:outline-none" />
        </div>

        <div id="roleSelectField" class="hidden">
          <label class="text-xs font-bold uppercase text-slate-400 block mb-1">Assign Initial Station Role</label>
          <select id="authRole" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm font-bold focus:border-blue-500 focus:outline-none">
            <option value="director">Tournament Director (Full Control)</option>
            <option value="weighmaster">Stage Weigh-Master (Scale Operator)</option>
            <option value="inspector">Dock Inspector (Holding Tanks)</option>
          </select>
        </div>

        <div id="errorAlert" class="hidden text-xs font-bold text-red-400 bg-red-950/40 border border-red-800 p-2.5 rounded-lg"></div>

        <button type="submit" id="authSubmitBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-black text-xs uppercase tracking-wider text-white rounded-lg transition shadow-lg mt-2">
          Sign In
        </button>
      </form>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://gjoxrosyboapwfqlfdye.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdqb3hyb3N5Ym9hcHdmcWxmZHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDEwMzQsImV4cCI6MjEwNDI3NzAzNH0.SFcX-NYJgL8lGv5QP2HXN83eaL7x2v0KCJonJXYoUAE';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authMode = 'login';

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        showUserCard(session.user);
      }
    });

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById('errorAlert').classList.add('hidden');
      if (mode === 'login') {
        document.getElementById('tabLogin').className = 'flex-1 py-2 border-b-2 border-blue-500 text-white';
        document.getElementById('tabRegister').className = 'flex-1 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-300';
        document.getElementById('nameField').classList.add('hidden');
        document.getElementById('roleSelectField').classList.add('hidden');
        document.getElementById('authSubmitBtn').innerText = 'Sign In';
      } else {
        document.getElementById('tabRegister').className = 'flex-1 py-2 border-b-2 border-blue-500 text-white';
        document.getElementById('tabLogin').className = 'flex-1 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-300';
        document.getElementById('nameField').classList.remove('hidden');
        document.getElementById('roleSelectField').classList.remove('hidden');
        document.getElementById('authSubmitBtn').innerText = 'Create Staff Account';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const btn = document.getElementById('authSubmitBtn');
      const errBox = document.getElementById('errorAlert');

      btn.disabled = true;
      btn.innerText = 'Communicating with AAFL Cloud...';
      errBox.classList.add('hidden');

      try {
        if (authMode === 'login') {
          const { data, error } = await client.auth.signInWithPassword({ email, password });
          if (error) throw error;
          showUserCard(data.user);
        } else {
          const fullName = document.getElementById('authFullName').value.trim();
          const role = document.getElementById('authRole').value;
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullName, role: role } }
          });
          if (error) throw error;
          
          if (data.user) {
            await client.from('user_profiles').upsert({
              id: data.user.id,
              email: email,
              full_name: fullName,
              role: role
            });
            showUserCard(data.user);
          }
        }
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = authMode === 'login' ? 'Sign In' : 'Create Staff Account';
      }
    }

    async function showUserCard(user) {
      document.getElementById('authFormsWrapper').classList.add('hidden');
      document.getElementById('userCard').classList.remove('hidden');
      document.getElementById('userEmailDisplay').innerText = user.email;

      const { data: profile } = await client
        .from('user_profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (profile && profile.role) {
        document.getElementById('roleBadge').innerText = profile.role.toUpperCase();
      }
    }

    async function handleSignOut() {
      await client.auth.signOut();
      window.location.reload();
    }
  </script>
</body>
</html>
