<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AAFL Official Stage Jumbotron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-10 font-sans select-none overflow-hidden">

  <!-- JUMBOTRON HEADER -->
  <div class="flex justify-between items-center border-b-2 border-slate-800 pb-6">
    <div>
      <span class="text-xs font-black uppercase text-amber-400 tracking-widest">American Anglers Fishing League</span>
      <h1 id="jumboTitle" class="text-4xl font-black text-white mt-1 uppercase">LAKE FORK CHAMPIONSHIP 2026</h1>
      <p id="jumboSubtitle" class="text-sm font-mono text-slate-400 mt-0.5">OFFICIAL CERTIFIED WEIGH-IN STAGE</p>
    </div>
    <div class="text-right">
      <span id="liveStatusBadge" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider animate-pulse">
        ● LIVE STAGE ACTIVE
      </span>
      <div id="clockDisplay" class="text-2xl font-mono font-bold text-slate-300 mt-2">--:--:--</div>
    </div>
  </div>

  <!-- CENTER STAGE DISPLAY -->
  <div class="my-auto text-center space-y-6">

    <!-- ANGLER BADGE -->
    <div class="inline-block bg-slate-900 border-2 border-slate-800 px-8 py-3 rounded-2xl shadow-2xl">
      <span class="text-xs font-black uppercase text-blue-400 tracking-widest block">Angler On Stage</span>
      <h2 id="jumboAnglerName" class="text-5xl lg:text-7xl font-black text-white mt-1">
        AWAITING NEXT ANGLER...
      </h2>
    </div>

    <!-- GIANT WEIGHT READOUT -->
    <div class="bg-gradient-to-b from-slate-950 to-slate-900 border-4 border-slate-800 rounded-3xl p-12 max-w-3xl mx-auto shadow-2xl">
      <div id="weightContainer">
        <span id="jumboWeight" class="font-mono text-8xl lg:text-9xl font-black text-emerald-400 tracking-tighter">0.00</span>
        <span class="text-3xl lg:text-4xl text-slate-500 font-bold ml-2 font-mono">LBS</span>
      </div>
      <div id="statusSubtext" class="text-base font-bold text-slate-400 mt-4 uppercase tracking-widest">
        SCALE READY
      </div>
    </div>

  </div>

  <!-- JUMBOTRON FOOTER -->
  <div class="flex justify-between items-end border-t-2 border-slate-800 pt-6 text-xs text-slate-500 font-mono">
    <div>
      <span>OFFICIAL CERTIFIED TOURNAMENT SCALES</span>
      <span class="mx-2">•</span>
      <span>0.25 LB DEAD FISH PENALTY DEDUCTION</span>
    </div>
    <div class="text-right text-slate-400">
      AAFL STAGE BROADCAST SYSTEM
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gjoxrosyboapwfqlfdye.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdqb3hyb3N5Ym9hcHdmcWxmZHllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDEwMzQsImV4cCI6MjEwNDI3NzAzNH0.SFcX-NYJgL8lGv5QP2HXN83eaL7x2v0KCJonJXYoUAE';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const broadcast = new BroadcastChannel('stage_jumbotron_feed');

    // Digital Clock
    setInterval(() => {
      document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // Initial Load: Fetch active tournament directly from Supabase
    window.addEventListener('DOMContentLoaded', async () => {
      const { data } = await client
        .from('tournaments')
        .select('*')
        .eq('is_active', true)
        .order('created_at', { ascending: false })
        .limit(1);

      if (data && data.length > 0) {
        document.getElementById('jumboTitle').innerText = data[0].title.toUpperCase();
        if (data[0].lake_name) {
          document.getElementById('jumboSubtitle').innerText = `${data[0].lake_name.toUpperCase()} • OFFICIAL WEIGH-IN STAGE`;
        }
      }
    });

    // Zero-Latency Stage Listener
    broadcast.onmessage = (event) => {
      const data = event.data;

      if (data.type === 'TOURNAMENT_SYNC') {
        document.getElementById('jumboTitle').innerText = data.tournamentTitle.toUpperCase();
        document.getElementById('jumboSubtitle').innerText = `${data.lakeName.toUpperCase()} • OFFICIAL WEIGH-IN STAGE`;
      }

      if (data.type === 'ANGLER_ON_STAGE') {
        document.getElementById('jumboAnglerName').innerText = data.anglerName.toUpperCase();
        document.getElementById('jumboWeight').innerText = '0.00';
        document.getElementById('jumboWeight').className = 'font-mono text-8xl lg:text-9xl font-black text-emerald-400 tracking-tighter';
        document.getElementById('statusSubtext').innerText = 'FISH ON SCALE...';
      }

      if (data.type === 'LIVE_WEIGHT_TICKER') {
        document.getElementById('jumboWeight').innerText = data.netWeight;
        document.getElementById('statusSubtext').innerText = data.deadPenalty > 0 
          ? `GROSS: ${data.grossWeight} LBS | DEAD PENALTY: -${data.deadPenalty} LBS` 
          : 'CALCULATING OFFICIAL NET...';
      }

      if (data.type === 'WEIGHT_LOCKED') {
        document.getElementById('jumboWeight').innerText = data.netWeight;
        document.getElementById('jumboWeight').className = 'font-mono text-8xl lg:text-9xl font-black text-blue-400 tracking-tighter animate-pulse';
        document.getElementById('statusSubtext').innerText = `★ OFFICIAL SCORE LOCKED: ${data.netWeight} LBS ★`;

        // Reset stage display after 10 seconds for the next boat
        setTimeout(() => {
          document.getElementById('jumboAnglerName').innerText = 'AWAITING NEXT ANGLER...';
          document.getElementById('jumboWeight').innerText = '0.00';
          document.getElementById('jumboWeight').className = 'font-mono text-8xl lg:text-9xl font-black text-emerald-400 tracking-tighter';
          document.getElementById('statusSubtext').innerText = 'SCALE READY';
        }, 10000);
      }
    };
  </script>
</body>
</html>
